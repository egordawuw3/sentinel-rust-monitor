[package]
name = "sentinel"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
teloxide = { version = "0.12", features = ["macros"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
dotenv = "0.15"
url = "2.4"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
futures = "0.3"
